<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
@font-face{font-family:'Instrument Serif';src:url(fonts/InstrumentSerif-Regular.ttf)}
@font-face{font-family:'Instrument Serif';font-style:italic;src:url(fonts/InstrumentSerif-Italic.ttf)}
html,body{margin:0;padding:0;background:#050403;overflow:hidden}
body{width:1600px;height:900px;position:relative;font-family:'Instrument Serif',serif;color:#e9dccb}
.mono{font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.top{position:absolute;left:96px;top:78px;display:flex;align-items:center;gap:16px;font-size:18px;letter-spacing:6px;color:#c4161c}
.dot{width:10px;height:10px;border-radius:50%;background:#c4161c;box-shadow:0 0 0 6px rgba(196,22,28,.18)}
.h{position:absolute;left:92px;top:150px;font-size:190px;line-height:.92;color:#c4161c;letter-spacing:4px}
.h i{display:block;font-size:150px;color:#e9dccb;letter-spacing:0}
.sub{position:absolute;left:98px;top:520px;font-size:40px;font-style:italic;color:#a89a82;max-width:720px;line-height:1.25}
.steps{position:absolute;left:98px;top:662px;display:flex;gap:44px;font-size:17px;letter-spacing:5px;color:#8a7b6c}
.steps b{color:#c4161c;font-weight:600;margin-right:10px}
.pill{position:absolute;left:96px;bottom:70px;display:flex;align-items:center;gap:18px;padding:16px 30px 16px 18px;border:1.5px solid rgba(196,22,28,.6);border-radius:999px;background:rgba(142,11,11,.16);font-size:22px;letter-spacing:6px;color:#e9dccb}
.pill .ic{width:40px;height:40px;border-radius:50%;background:#8e0b0b;display:grid;place-items:center}
.pill b{color:#c4161c;font-weight:600}
.dom{position:absolute;right:96px;bottom:86px;font-size:22px;letter-spacing:6px;color:#8a7b6c}
.dom b{color:#e9dccb;font-weight:400}
</style></head><body>
<svg style="position:absolute;inset:0" viewBox="0 0 1600 900" width="1600" height="900">
